# Render Infrastructure Blueprint for Raitha Mitra Deployment
# Defines Backend Dockerized Spring Boot Web Service and Frontend React Static Web Service.

services:
  # Spring Boot Backend Dockerized Web Service
  - type: web
    name: raitha-mitra-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OTP_ENABLED
        value: "false" # Explicitly set false for Demo/Portfolio deployment without SMS OTP

      - key: DATABASE_URL
        sync: false # Set to Neon PostgreSQL JDBC Connection String in Render Dashboard
      - key: DATABASE_USERNAME
        sync: false # Set to Neon Database Username
      - key: DATABASE_PASSWORD
        sync: false # Set to Neon Database Password
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a 256-bit secure secret key
      - key: FRONTEND_ORIGIN
        sync: false # Set to https://<frontend-service-name>.onrender.com
      - key: MSG91_AUTH_KEY
        sync: false # MSG91 Authentication Key from MSG91 Dashboard
      - key: MSG91_TEMPLATE_ID
        sync: false # MSG91 Approved DLT Template ID
      - key: MSG91_SENDER_ID
        sync: false # MSG91 Approved 6-character Header/Sender ID (e.g. RAITHA)


  # React / Vite Frontend Static Site
  - type: web
    name: raitha-mitra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://<backend-service-name>.onrender.com/api/v1
