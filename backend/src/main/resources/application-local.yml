spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raitha_mitra_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway manages schema creation; Hibernate validates schema alignment
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:RaithaMitraSuperSecureJwtSecretKeyForDevelopmentPhase2026MustBeAtLeast256BitsLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

